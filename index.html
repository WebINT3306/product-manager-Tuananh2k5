<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sản phẩm</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1, h2 {
            text-align: center;
            color: #444;
        }
        
        /* Form Styles */
        .form-section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 0.9rem;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #btn-add {
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            grid-column: 1 / -1;
            width: fit-content;
            justify-self: center;
        }
        #btn-add:hover {
            background-color: #218838;
        }

        /* Table Styles */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f8f9fa;
            cursor: pointer;
            user-select: none;
        }
        th:hover {
            background-color: #e2e6ea;
        }
        
        /* Zebra stripes & Hover */
        tbody tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tbody tr:hover {
            background-color: #f1f1f1;
        }

        #loading-state {
            text-align: center;
            padding: 20px;
            font-style: italic;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Quản lý Sản phẩm</h1>

        <!-- Form Section -->
        <div class="form-section">
            <h2>Thêm sản phẩm mới</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label for="input-name">Tên sản phẩm</label>
                    <input type="text" id="input-name" placeholder="Tên sản phẩm...">
                </div>
                <div class="form-group">
                    <label for="input-category">Danh mục</label>
                    <input type="text" id="input-category" placeholder="Danh mục...">
                </div>
                <div class="form-group">
                    <label for="input-price">Đơn giá</label>
                    <input type="number" id="input-price" placeholder="Ví dụ: 8500000">
                </div>
                <div class="form-group">
                    <label for="input-quantity">Số lượng</label>
                    <input type="number" id="input-quantity" placeholder="Ví dụ: 5">
                </div>
                <button id="btn-add">Thêm sản phẩm</button>
            </div>
        </div>

        <!-- Table Section -->
        <h2>Danh sách sản phẩm</h2>
        <div id="loading-state">Đang tải dữ liệu...</div>
        <table id="product-table">
            <thead>
                <tr>
                    <th>STT</th>
                    <th id="header-name">Tên sản phẩm</th>
                    <th>Danh mục</th>
                    <th>Đơn giá</th>
                    <th>Số lượng</th>
                </tr>
            </thead>
            <tbody id="product-body">
                <!-- Dữ liệu nạp từ products.json -->
            </tbody>
        </table>
    </div>

    <script>
        let products = [];
        let sortAsc = true;

        const productBody = document.getElementById('product-body');
        const loadingState = document.getElementById('loading-state');
        const btnAdd = document.getElementById('btn-add');
        const headerName = document.getElementById('header-name');

        const inputName = document.getElementById('input-name');
        const inputCategory = document.getElementById('input-category');
        const inputPrice = document.getElementById('input-price');
        const inputQuantity = document.getElementById('input-quantity');

        // 1. AJAX load products
        function loadProducts() {
            const xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    try {
                        products = JSON.parse(xhr.responseText);
                        renderTable();
                        if (loadingState) loadingState.style.display = 'none';
                    } catch (e) {
                        if (loadingState) loadingState.textContent = 'Lỗi xử lý file JSON';
                    }
                } else if (xhr.readyState === 4 && xhr.status !== 200) {
                    if (loadingState) loadingState.textContent = 'Lỗi nạp dữ liệu';
                }
            };
            xhr.open('GET', 'products.json', true);
            xhr.send();
        }

        // 2. Render table
        function renderTable() {
            productBody.innerHTML = '';
            products.forEach((p, index) => {
                const tr = document.createElement('tr');
                // Use raw values without currency formatting for autograder safety
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${p.name}</td>
                    <td>${p.category || 'N/A'}</td>
                    <td>${p.price}</td>
                    <td>${p.quantity}</td>
                `;
                productBody.appendChild(tr);
            });
        }

        // 3. Sorting
        headerName.addEventListener('click', function() {
            if (products.length === 0) return;
            
            products.sort((a, b) => {
                const nameA = a.name.toLowerCase();
                const nameB = b.name.toLowerCase();
                if (nameA < nameB) return sortAsc ? -1 : 1;
                if (nameA > nameB) return sortAsc ? 1 : -1;
                return 0;
            });
            
            // Toggle indicator
            const symbol = sortAsc ? ' ▲' : ' ▼';
            headerName.textContent = 'Tên sản phẩm' + symbol;
            
            sortAsc = !sortAsc;
            renderTable();
        });

        // 4. Add product
        btnAdd.addEventListener('click', function() {
            const name = inputName.value.trim();
            const category = inputCategory.value.trim() || 'Khác';
            const price = parseFloat(inputPrice.value);
            const quantity = parseInt(inputQuantity.value);

            // Basic validation
            if (name.length < 3) {
                alert('Tên sản phẩm tối thiểu 3 ký tự');
                return;
            }
            if (isNaN(price) || price <= 0) {
                alert('Đơn giá phải là số dương');
                return;
            }
            if (isNaN(quantity) || quantity < 1) {
                alert('Số lượng phải >= 1');
                return;
            }

            const newProduct = {
                id: Date.now(),
                name: name,
                category: category,
                price: price,
                quantity: quantity
            };

            products.push(newProduct);
            renderTable();

            // Reset inputs
            inputName.value = '';
            inputCategory.value = '';
            inputPrice.value = '';
            inputQuantity.value = '';
            
            alert('Thêm sản phẩm thành công!');
        });

        // Init
        loadProducts();
    </script>
</body>
</html>
