<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản Phẩm</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { cursor: pointer; background: #eee; }
        tr:nth-child(even) { background: #f9f9f9; }
        tr:hover { background: #f1f1f1; }
        .form-group { margin-bottom: 10px; }
        input { padding: 5px; width: 200px; }
        button { padding: 5px 15px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Thêm sản phẩm</h2>
        <div class="form-group">
            <input type="text" id="input-name" placeholder="Tên sản phẩm">
            <input type="text" id="input-category" placeholder="Danh mục">
            <input type="number" id="input-price" placeholder="Đơn giá">
            <input type="number" id="input-quantity" placeholder="Số lượng">
            <button id="btn-add">Thêm</button>
        </div>

        <h2>Danh sách sản phẩm</h2>
        <table id="product-table">
            <thead>
                <tr>
                    <th>STT</th>
                    <th id="header-name">Tên sản phẩm</th>
                    <th>Danh mục</th>
                    <th>Đơn giá</th>
                    <th>Số lượng</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        let products = [];
        let sortAsc = true;

        // 1. AJAX load
        function loadProducts() {
            const xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    products = JSON.parse(xhr.responseText);
                    renderTable();
                }
            };
            xhr.open('GET', 'products.json');
            xhr.send();
        }

        // 2. Render
        function renderTable() {
            const tbody = document.querySelector('#product-table tbody');
            tbody.innerHTML = '';
            products.forEach((p, i) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${i + 1}</td>
                    <td>${p.name}</td>
                    <td>${p.category || ''}</td>
                    <td>${p.price}</td>
                    <td>${p.quantity}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 3. Sort
        const headerName = document.getElementById('header-name');
        headerName.addEventListener('click', function() {
            products.sort((a, b) => {
                const s1 = a.name.toLowerCase();
                const s2 = b.name.toLowerCase();
                if (s1 < s2) return sortAsc ? -1 : 1;
                if (s1 > s2) return sortAsc ? 1 : -1;
                return 0;
            });
            headerName.textContent = 'Tên sản phẩm ' + (sortAsc ? '▲' : '▼');
            sortAsc = !sortAsc;
            renderTable();
        });

        // 4. Add
        const btnAdd = document.getElementById('btn-add');
        btnAdd.addEventListener('click', function() {
            const name = document.getElementById('input-name').value.trim();
            const category = document.getElementById('input-category').value.trim();
            const price = parseFloat(document.getElementById('input-price').value);
            const quantity = parseInt(document.getElementById('input-quantity').value);

            if (name.length >= 3 && price > 0 && quantity >= 1) {
                const newP = { name, category, price, quantity };
                products.push(newP);
                renderTable();
                
                // Reset
                document.getElementById('input-name').value = '';
                document.getElementById('input-category').value = '';
                document.getElementById('input-price').value = '';
                document.getElementById('input-quantity').value = '';
            }
        });

        document.addEventListener('DOMContentLoaded', loadProducts);
    </script>
</body>
</html>
